name: Buat APK FINORA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Buat proyek Android
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/finora/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FINORA"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.finora.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.finora.app'
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName '0.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="FINORA"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/finora/app/MainActivity.java <<'EOF'
          package com.finora.app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.text.InputType;
          import android.view.View;
          import android.widget.*;
          import java.text.NumberFormat;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private SharedPreferences data;
              private LinearLayout layout;
              private TextView summary;
              private TextView history;
              private ProgressBar progress;
              private EditText amount;
              private EditText note;

              private final NumberFormat currency =
                  NumberFormat.getCurrencyInstance(new Locale("id", "ID"));

              private long available() {
                  return data.getLong("available", 0);
              }

              private long savings() {
                  return data.getLong("savings", 0);
              }

              private TextView text(String value, int size) {
                  TextView view = new TextView(this);
                  view.setText(value);
                  view.setTextSize(size);
                  view.setTextColor(Color.rgb(15, 37, 64));
                  view.setPadding(0, 12, 0, 12);
                  layout.addView(view);
                  return view;
              }

              private void button(String title, View.OnClickListener action) {
                  Button button = new Button(this);
                  button.setText(title);
                  button.setOnClickListener(action);
                  layout.addView(button);
              }

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  data = getSharedPreferences("finora", MODE_PRIVATE);

                  ScrollView scroll = new ScrollView(this);
                  layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(32, 36, 32, 36);
                  layout.setBackgroundColor(Color.rgb(244, 247, 251));
                  scroll.addView(layout);
                  setContentView(scroll);

                  text("FINORA", 30);
                  text("Keuangan & tabungan — versi awal offline", 14);

                  summary = text("", 19);
                  progress = new ProgressBar(
                      this, null, android.R.attr.progressBarStyleHorizontal
                  );
                  progress.setMax(100);
                  layout.addView(progress);

                  amount = new EditText(this);
                  amount.setHint("Nominal Rupiah, contoh 100000");
                  amount.setInputType(InputType.TYPE_CLASS_NUMBER);
                  layout.addView(amount);

                  note = new EditText(this);
                  note.setHint("Catatan opsional");
                  layout.addView(note);

                  button("Tambah pemasukan", v -> record("income"));
                  button("Catat pengeluaran", v -> record("expense"));
                  button("Setor ke tabungan", v -> record("deposit"));
                  button("Tarik dari tabungan", v -> record("withdraw"));

                  button("Atur nominal target", v -> {
                      EditText input = new EditText(this);
                      input.setHint("Nominal target");
                      input.setInputType(InputType.TYPE_CLASS_NUMBER);

                      new AlertDialog.Builder(this)
                          .setTitle("Target tabungan")
                          .setView(input)
                          .setPositiveButton("Simpan", (dialog, which) -> {
                              try {
                                  long target = Long.parseLong(
                                      input.getText().toString()
                                  );
                                  if (target <= 0) {
                                      throw new IllegalArgumentException();
                                  }
                                  data.edit().putLong("target", target).apply();
                                  refresh();
                              } catch (Exception error) {
                                  toast("Target harus lebih dari nol.");
                              }
                          })
                          .setNegativeButton("Batal", null)
                          .show();
                  });

                  text("Riwayat", 21);
                  history = text("", 14);
                  text(
                      "Data tersimpan di aplikasi ini. Tidak ada login Google, "
                      + "sinkronisasi cloud, atau ekspor cadangan pada versi ini. "
                      + "Jangan hapus data aplikasi jika masih diperlukan.",
                      12
                  );
                  refresh();
              }

              private void toast(String message) {
                  Toast.makeText(this, message, Toast.LENGTH_LONG).show();
              }

              private void record(String type) {
                  try {
                      long value = Long.parseLong(
                          amount.getText().toString()
                      );
                      if (value <= 0) {
                          toast("Nominal harus lebih dari nol.");
                          return;
                      }

                      long cash = available();
                      long saved = savings();
                      String title;

                      switch (type) {
                          case "income":
                              cash = Math.addExact(cash, value);
                              title = "Pemasukan";
                              break;

                          case "expense":
                              if (value > cash) {
                                  toast("Saldo tersedia tidak cukup.");
                                  return;
                              }
                              cash -= value;
                              title = "Pengeluaran";
                              break;

                          case "deposit":
                              if (value > cash) {
                                  toast("Saldo tersedia tidak cukup.");
                                  return;
                              }
                              cash -= value;
                              saved = Math.addExact(saved, value);
                              title = "Setoran tabungan";
                              break;

                          default:
                              if (value > saved) {
                                  toast("Saldo tabungan tidak cukup.");
                                  return;
                              }
                              saved -= value;
                              cash = Math.addExact(cash, value);
                              title = "Penarikan tabungan";
                      }

                      Math.addExact(cash, saved);

                      java.text.SimpleDateFormat format =
                          new java.text.SimpleDateFormat(
                              "dd/MM/yyyy HH:mm", new Locale("id", "ID")
                          );
                      format.setTimeZone(
                          java.util.TimeZone.getTimeZone("Asia/Jakarta")
                      );

                      String entry =
                          format.format(new java.util.Date()) + " WIB
"
                          + title + ": " + currency.format(value)
                          + "
" + note.getText().toString().trim()
                          + "

";

                      boolean success = data.edit()
                          .putLong("available", cash)
                          .putLong("savings", saved)
                          .putString(
                              "history",
                              entry + data.getString("history", "")
                          )
                          .commit();

                      if (!success) {
                          toast("Gagal menyimpan. Silakan coba lagi.");
                          return;
                      }

                      amount.setText("");
                      note.setText("");
                      refresh();
                      toast("Berhasil disimpan.");
                  } catch (Exception error) {
                      toast("Nominal tidak valid atau terlalu besar.");
                  }
              }

              private void refresh() {
                  long target = data.getLong("target", 0);
                  long saved = savings();
                  int percentage = target > 0
                      ? (int) Math.min(100.0, saved * 100.0 / target)
                      : 0;

                  summary.setText(
                      "Saldo tersedia: " + currency.format(available())
                      + "
Tabungan: " + currency.format(saved)
                      + "
Total dana: "
                      + currency.format(available() + saved)
                      + "
Target: "
                      + (target > 0 ? currency.format(target) : "Belum diatur")
                      + "
Pencapaian: " + percentage + "%"
                  );

                  progress.setProgress(percentage);
                  history.setText(
                      data.getString("history", "Belum ada aktivitas.")
                  );
              }
          }
          EOF

      - name: Bangun APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Simpan APK untuk diunduh
        uses: actions/upload-artifact@v4
        with:
          name: FINORA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
