name: APK FINORA

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Pasang SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Siapkan aplikasi
        run: |
          mkdir -p app/src/main/java/com/finora/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = 'FINORA'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.finora.app'
            compileSdk 35
            defaultConfig {
              applicationId 'com.finora.app'
              minSdk 24
              targetSdk 34
              versionCode 2
              versionName '0.2'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="FINORA" android:allowBackup="false" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/finora/app/MainActivity.java <<'EOF'
          package com.finora.app;
          import android.app.*;
          import android.os.Bundle;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.widget.*;
          import java.text.*;
          import java.util.*;

          public class MainActivity extends Activity {
            SharedPreferences db;
            LinearLayout box;
            TextView totals, history;
            EditText amount, note;
            NumberFormat money = NumberFormat.getCurrencyInstance(new Locale("id","ID"));

            TextView text(String value, int size) {
              TextView t = new TextView(this);
              t.setText(value);
              t.setTextSize(size);
              t.setTextColor(Color.rgb(15,37,64));
              t.setPadding(0,16,0,16);
              box.addView(t);
              return t;
            }

            void button(String label, Runnable action) {
              Button b = new Button(this);
              b.setText(label);
              b.setOnClickListener(v -> action.run());
              box.addView(b);
            }

            void message(String s) {
              Toast.makeText(this,s,Toast.LENGTH_LONG).show();
            }

            public void onCreate(Bundle state) {
              super.onCreate(state);
              db = getSharedPreferences("finora",MODE_PRIVATE);
              ScrollView scroll = new ScrollView(this);
              box = new LinearLayout(this);
              box.setOrientation(1);
              box.setPadding(32,32,32,32);
              box.setBackgroundColor(Color.rgb(244,247,251));
              scroll.addView(box);
              setContentView(scroll);
              text("FINORA",30);
              text("Keuangan pribadi - offline",14);
              totals = text("",19);
              amount = new EditText(this);
              amount.setHint("Nominal Rupiah");
              amount.setInputType(2);
              box.addView(amount);
              note = new EditText(this);
              note.setHint("Catatan opsional");
              box.addView(note);
              button("Tambah pemasukan", () -> record(0));
              button("Catat pengeluaran", () -> record(1));
              button("Setor tabungan", () -> record(2));
              button("Tarik tabungan", () -> record(3));
              button("Atur target tabungan", () -> target());
              text("Riwayat",22);
              history = text("",14);
              text("Versi awal. Data lokal tanpa login Google atau cadangan. Jangan hapus data aplikasi jika masih diperlukan.",12);
              refresh();
            }

            void target() {
              EditText input = new EditText(this);
              input.setInputType(2);
              input.setHint("Nominal target Rupiah");
              new AlertDialog.Builder(this)
                .setTitle("Target tabungan")
                .setView(input)
                .setPositiveButton("Simpan",(d,w) -> {
                  try {
                    long x = Long.parseLong(input.getText().toString());
                    if(x <= 0) throw new Exception();
                    if(!db.edit().putLong("target",x).commit()) {
                      message("Gagal menyimpan.");
                      return;
                    }
                    refresh();
                  } catch(Exception e) {
                    message("Isi nominal lebih dari nol.");
                  }
                })
                .setNegativeButton("Batal",null)
                .show();
            }

            void record(int type) {
              try {
                long x = Long.parseLong(amount.getText().toString());
                if(x <= 0) {
                  message("Nominal harus lebih dari nol.");
                  return;
                }
                long a = db.getLong("available",0);
                long s = db.getLong("savings",0);
                String[] labels = {"Pemasukan","Pengeluaran","Setoran","Penarikan"};
                if((type == 1 || type == 2) && x > a) {
                  message("Saldo tersedia tidak cukup.");
                  return;
                }
                if(type == 3 && x > s) {
                  message("Saldo tabungan tidak cukup.");
                  return;
                }
                if(type == 0) a = Math.addExact(a,x);
                if(type == 1) a -= x;
                if(type == 2) {
                  a -= x;
                  s = Math.addExact(s,x);
                }
                if(type == 3) {
                  s -= x;
                  a = Math.addExact(a,x);
                }
                Math.addExact(a,s);
                SimpleDateFormat f = new SimpleDateFormat("dd/MM/yyyy HH:mm",new Locale("id","ID"));
                f.setTimeZone(TimeZone.getTimeZone("Asia/Jakarta"));
                                String nl = System.lineSeparator();
                String row = f.format(new Date()) + " WIB" + nl;
                row += labels[type] + ": " + money.format(x) + nl;
                row += note.getText().toString() + nl + nl;
                boolean ok = db.edit()
                  .putLong("available",a)
                  .putLong("savings",s)
                  .putString("history",row + db.getString("history",""))
                  .commit();
                if(!ok) {
                  message("Gagal menyimpan.");
                  return;
                }
                amount.setText("");
                note.setText("");
                refresh();
                message("Berhasil disimpan.");
              } catch(Exception e) {
                message("Nominal kosong atau terlalu besar.");
              }
            }

            void refresh() {
              long a = db.getLong("available",0);
              long s = db.getLong("savings",0);
              long t = db.getLong("target",0);
              double p = t > 0 ? Math.min(100,s * 100.0 / t) : 0;
              String v = "Saldo tersedia: " + money.format(a);
              v += "
              v += "Tabungan: " + money.format(s) + nl;
              v += "Total dana: " + money.format(a+s) + nl;
              v += "Target: " + (t > 0 ? money.format(t) : "Belum diatur") + nl;
              v += "Pencapaian: " + String.format(new Locale("id","ID"),"%.1f%%",p) + nl;
              totals.setText(v);
              history.setText(db.getString("history","Belum ada transaksi."));
            }
          }
          EOF

      - name: Bangun APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Unggah hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: FINORA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
